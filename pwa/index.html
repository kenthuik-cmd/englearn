<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>AI英语进阶闯关</title>

  <!-- iPhone PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="AI英语进阶闯关"
  >

  <meta name="theme-color" content="#ffffff">

  <!-- 自定义图标 -->
  <link
    rel="apple-touch-icon"
    href="https://kenthuik-cmd.github.io/englearn/pwa/icon-192.png?v=3"
  >

  <link
    rel="icon"
    type="image/png"
    href="https://kenthuik-cmd.github.io/englearn/pwa/icon-192.png?v=3"
  >

  <!-- PWA Manifest -->
  <link
    rel="manifest"
    href="https://kenthuik-cmd.github.io/englearn/pwa/manifest.json?v=3"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 32px;
      box-sizing: border-box;
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      object-fit: cover;
      display: block;
      margin: 0 auto 22px;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 18px;
      color: #777777;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 32px;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      class="icon"
      src="https://kenthuik-cmd.github.io/englearn/pwa/icon-192.png?v=3"

    <div class="sub">
      英语学习 · 挂机听 · 进阶闯关

    <a
      class="btn"
      href="https://englearn-ars9vu4ac3vcwhsozqpayc.streamlit.app/"
    >
      开始学习
    </a>

  </div>

  <script>
    /*
      进入 PWA 后自动打开真正的学习 App。

      这样即使 iPhone 主屏幕启动时没有正确
      使用 manifest 的 start_url，也不会停留在
      GitHub Pages 的 404 页面。
    */

    const STREAMLIT_APP =
      "https://englearn-ars9vu4ac3vcwhsozqpayc.streamlit.app/";

    // 给 Safari 一点时间完成页面初始化，
    // 然后自动进入 Streamlit。
    setTimeout(function () {
      window.location.replace(STREAMLIT_APP);
    }, 500);
  </script>

</body>
</html>
